name: web-based-python
services:
  # คลังเก็บคิวงาน BullMQ
  redis:
    image: redis:6.0
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    restart: always

  # Backend NestJS Service
  backend:
    build:
      context: ./srv
      dockerfile: Dockerfile
      target: dev
    container_name: web-based-python-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./srv/.env
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./srv:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis


  # Frontend Vite Service
  frontend:
    build:
      context: ./cln
      dockerfile: Dockerfile
      target: dev
    container_name: web-based-python-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ./cln:/app
      - /app/node_modules
    depends_on:
      - backend

networks:
  default:
    name: web-based-python-net





